name: Build SHARAFI AI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download Prebuilt Sherpa-ONNX JNI Libraries
        run: |
          mkdir -p app/libs
          echo "Fetching official Sherpa-ONNX prebuilt Android AAR..."
          curl -fL "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.10.30/sherpa-onnx-1.10.30.aar" -o app/libs/sherpa-onnx.aar || true

      - name: Build Debug & Release APKs
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHARAFI-AI-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
